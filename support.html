<style>
  :root { --bg:#F5F5F0; --card:rgba(255,255,255,.72); --border:rgba(30,107,86,.14); --primary:#1E6B56; --accent:#DE9F2F; --text:#1C2420; --dim:#5E6B65; color-scheme:light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111614; --card:rgba(255,255,255,.05); --border:rgba(255,255,255,.10); --primary:#4DB38F; --accent:#EDB54C; --text:#EEF2EF; --dim:#9AA8A1; } }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:'IBM Plex Sans Arabic', system-ui, sans-serif; color:var(--text); line-height:1.85;
    background:
      radial-gradient(520px 420px at 95% -5%, color-mix(in srgb, var(--primary) 26%, transparent), transparent 70%),
      radial-gradient(460px 380px at -10% 85%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%);
    background-color:var(--bg); min-height:100vh;
  }
  header { text-align:center; margin-bottom:28px; }
  header img { width:88px; height:88px; border-radius:22px; box-shadow:0 10px 30px rgba(30,107,86,.25); }
  h1 { font-size:36px; margin:14px 0 2px; }
  h1 .s { color:var(--accent); }
  .tag { color:var(--dim); margin:0; }
  footer { text-align:center; color:var(--dim); font-size:14px; margin-top:32px; }
  footer a { color:var(--dim); }
  a { color:var(--primary); }
  main { max-width:560px; margin:0 auto; padding:56px 16px 64px; }
  .contact { display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--text); background:var(--card); border:1px solid var(--border); border-radius:22px; padding:18px 22px; margin-bottom:14px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .contact:hover { border-color:var(--primary); }
  .icon { flex:none; width:50px; height:50px; border-radius:16px; display:grid; place-items:center; background:var(--primary); }
  .icon svg { width:24px; height:24px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .label { display:block; color:var(--dim); font-size:15px; }
  .value { display:block; font-size:19px; font-weight:600; direction:ltr; text-align:right; }
</style>
</head>

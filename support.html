<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>ركّز · الدعم</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --space:#05060F; --card:rgba(255,255,255,.06); --border:rgba(255,255,255,.14); --nebula:#7C5CFF; --cyan:#3DD9EB; --text:#F4F3FF; --dim:#A9A6C9; }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:'IBM Plex Sans Arabic', system-ui, sans-serif; color:var(--text); line-height:1.8;
    background:
      radial-gradient(ellipse 700px 500px at 85% 0%, rgba(124,92,255,.35), transparent 70%),
      linear-gradient(180deg, #0D1030 0%, var(--space) 60%);
    background-color:var(--space); min-height:100vh;
  }
  main { max-width:560px; margin:0 auto; padding:56px 16px 64px; }
  header { text-align:center; margin-bottom:32px; }
  header img { width:96px; height:96px; border-radius:22px; box-shadow:0 12px 40px rgba(124,92,255,.45); }
  h1 { font-size:40px; margin:16px 0 4px; }
  .tag { color:var(--dim); margin:0; }
  .contact {
    display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--text);
    background:var(--card); border:1px solid var(--border); border-radius:24px; padding:20px 24px; margin-bottom:16px;
  }
  .contact:hover { border-color:var(--nebula); }
  .icon { flex:none; width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(135deg, var(--cyan), var(--nebula)); }
  .icon svg { width:26px; height:26px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .label { display:block; color:var(--dim); font-size:15px; }
  .value { display:block; font-size:20px; font-weight:600; direction:ltr; text-align:right; }
  footer { text-align:center; color:var(--dim); font-size:14px; margin-top:32px; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.png" alt="أيقونة ركّز">
    <h1>تواصل معنا</h1>

  </header>

    <span><span class="label">واتساب · WhatsApp</span><span class="value">+966 58 110 5341</span></span>

</html>
